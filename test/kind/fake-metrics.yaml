# A Prometheus-shaped endpoint whose value is driven by a ConfigMap, so the
# test can move "demand" and watch the cluster respond.
#
# Deliberately not a real Prometheus: this suite is about whether presage can
# scale a workload on a live cluster, not about whether Prometheus works.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-metrics-demand
  namespace: presage-e2e
data:
  demand: "100"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-metrics-src
  namespace: presage-e2e
data:
  server.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import parse_qs

    DEMAND_FILE = "/config/demand"

    def demand():
        try:
            with open(DEMAND_FILE) as f:
                return float(f.read().strip())
        except Exception:
            return 100.0

    class H(BaseHTTPRequestHandler):
        def _send(self, payload):
            body = json.dumps(payload).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0))
            form = parse_qs(self.rfile.read(n).decode())
            v = demand()
            if self.path.startswith("/api/v1/query_range"):
                start = float(form["start"][0])
                end = float(form["end"][0])
                step = float(form["step"][0])
                vals, t = [], start
                while t <= end:
                    vals.append([t, f"{v:.3f}"])
                    t += step
                self._send({"status": "success", "data": {"resultType": "matrix",
                    "result": [{"metric": {}, "values": vals}]}})
            else:
                self._send({"status": "success", "data": {"resultType": "vector",
                    "result": [{"metric": {}, "value": [time.time(), f"{v:.3f}"]}]}})

        def log_message(self, *a):
            pass

    HTTPServer(("0.0.0.0", 9090), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-metrics
  namespace: presage-e2e
spec:
  replicas: 1
  selector: {matchLabels: {app: fake-metrics}}
  template:
    metadata: {labels: {app: fake-metrics}}
    spec:
      containers:
        - name: server
          image: python:3.12-slim
          command: ["python", "/src/server.py"]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: src, mountPath: /src}
            - {name: config, mountPath: /config}
      volumes:
        - {name: src, configMap: {name: fake-metrics-src}}
        - {name: config, configMap: {name: fake-metrics-demand}}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-metrics
  namespace: presage-e2e
spec:
  selector: {app: fake-metrics}
  ports: [{port: 9090, targetPort: 9090}]
