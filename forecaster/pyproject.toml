[project]
name = "presage-forecaster"
version = "0.1.0"
description = "TimesFM model server for the presage predictive autoscaler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The model itself is an extra so that the HTTP surface can be developed and
# tested without pulling a multi-gigabyte torch wheel.
torch = ["timesfm[torch]>=2.0.0"]
flax = ["timesfm[flax]>=2.0.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
presage-forecaster = "presage_forecaster.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["presage_forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
