apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: presage-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: presage-manager
subjects:
  - kind: ServiceAccount
    name: presage-manager
    namespace: presage-system
---
# Leader election needs a lease in the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: presage-leader-election
  namespace: presage-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: presage-leader-election
  namespace: presage-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: presage-leader-election
subjects:
  - kind: ServiceAccount
    name: presage-manager
    namespace: presage-system
